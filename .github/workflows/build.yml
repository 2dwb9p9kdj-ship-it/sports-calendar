name: Build calendar

on:
  schedule:
    # Every two hours. Results can only appear as fast as the build runs, and
    # scheduled runs are free without limit on a public repository.
    - cron: "0 */2 * * *"
  workflow_dispatch:        # lets you press a button to run it by hand
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the calendar
        run: python3 generate.py

      - name: Add the unlock page
        run: cp unlock.html docs/unlock.html

      - name: Package the output
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
